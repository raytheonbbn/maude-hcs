env: pwnd_cp3_only_iodine
conversation_duration: 11700
max_start_delay: 900
one_way_availability: 30
analysis_window_size: 900
network:
  client_net_iodine:
    nat: false
    network: client
    params:
      upstream:
        latency: 10
        loss_profile: "excellent"
      downstream:
        latency: 10
        loss_profile: "excellent"
  server_net:
    network: server
    params:
      upstream:
        latency: 5
        loss_profile: "excellent"
      downstream:
        latency: 5
        loss_profile: "excellent"
  dns_net:
    network: dns
    params:
      upstream:
        latency: 5
        loss_profile: "excellent"
      downstream:
        latency: 5
        loss_profile: "excellent"
nodes:
  node_type_iodine:
    channel_config:
      - direction: bidirectional
        channel: iodine
        vars:
          client:
            max_response_size: 202
            max_query_length: 102
    client_per_network:
      client_net_iodine:
        quantity: 2
        profiles:
          irc_2: 0.5
          irc_7: 0.5
