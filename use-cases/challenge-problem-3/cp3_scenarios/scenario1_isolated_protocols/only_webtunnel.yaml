env: pwnd_cp3_only_webtunnel
conversation_duration: 1200
max_start_delay: 180

network:
  minio_net:
    network: minio
    params:
      upstream:
        latency: 0
        loss_profile: "none"
      downstream:
        latency: 0
        loss_profile: "none"
  mastodon_net:
    network: mastodon
    params:
      upstream:
        latency: 0
        loss_profile: "none"
      downstream:
        latency: 0
        loss_profile: "none"
  client_net_racetunnel:
    nat: false
    network: client
    params:
      upstream:
        latency: 30
        loss_profile: "good"
      downstream:
        latency: 30
        loss_profile: "good"
  server_net:
    network: server
    params:
      upstream:
        latency: 5
        loss_profile: "excellent"
      downstream:
        latency: 5
        loss_profile: "excellent"
  dns_net:
    network: dns
    params:
      upstream:
        latency: 5
        loss_profile: "excellent"
      downstream:
        latency: 5
        loss_profile: "excellent"
nodes:
  node_type_racetunnel:
    channel_config:
      - direction: bidirectional
        channel: racetunnel
        vars:
          client:
            user_model: ""
          server:
            user_model: ""
    client_per_network:
      client_net_racetunnel:
        quantity: 2
        profiles:
          irc_6: 0.5
          irc_2: 0.5
