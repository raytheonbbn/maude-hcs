env: pwnd_cp3_only_mastodon
conversation_duration: 11700
max_start_delay: 900
one_way_availability: 30
analysis_window_size: 900
network:
  minio_net:
    network: minio
    params:
      upstream:
        latency: 0
        loss_profile: "none"
      downstream:
        latency: 0
        loss_profile: "none"
  client_net_mastodon:
    nat: false
    network: client
    params:
      upstream:
        latency: 25
        loss_profile: "excellent"
      downstream:
        latency: 25
        loss_profile: "excellent"
  server_net:
    network: server
    params:
      upstream:
        latency: 5
        loss_profile: "excellent"
      downstream:
        latency: 5
        loss_profile: "excellent"
  mastodon_net:
    network: mastodon
    params:
      upstream:
        latency: 10
        loss_profile: "excellent"
      downstream:
        latency: 10
        loss_profile: "excellent"
  dns_net:
    network: dns
    params:
      upstream:
        latency: 5
        loss_profile: "excellent"
      downstream:
        latency: 5
        loss_profile: "excellent"
nodes:
  node_type_mastodon:
    channel_config:
      - direction: bidirectional
        channel: mastodon
        vars:
          client:
            user_model: mastodon_client_scenario_1.json
          server:
            user_model: mastodon_server_scenario_1.json
    client_per_network:
      client_net_mastodon:
        quantity: 2
        profiles:
          irc_6: 1
