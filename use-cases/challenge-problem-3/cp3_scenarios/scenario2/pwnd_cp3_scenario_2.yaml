env: pwnd_cp3_scenario_2
conversation_duration: 11700
max_start_delay: 900
one_way_availability: 30
analysis_window_size: 900
network:
  client_net_mastodon:
    nat: false
    network: client
    params:
      upstream:
        latency: 20
        loss_profile: "excellent"
      downstream:
        latency: 20
        loss_profile: "excellent"
  client_net_racetunnel:
    nat: false
    network: client
    params:
      upstream:
        latency: 20
        loss_profile: "good"
      downstream:
        latency: 20
        loss_profile: "good"
  client_net_obfs:
    nat: false
    network: client
    params:
      upstream:
        latency: 20
        loss_profile: "good"
      downstream:
        latency: 20
        loss_profile: "good"
  client_net_sky:
    nat: false
    network: client
    params:
      upstream:
        latency: 5
        loss_profile: "excellent"
      downstream:
        latency: 5
        loss_profile: "excellent"
  server_net:
    network: server
    params:
      upstream:
        latency: 10
        loss_profile: "excellent"
      downstream:
        latency: 10
        loss_profile: "excellent"
  minio_net:
    network: minio
    params:
      upstream:
        latency: 15
        loss_profile: "good"
      downstream:
        latency: 15
        loss_profile: "good"
  mastodon_net:
    network: mastodon
    params:
      upstream:
        latency: 5
        loss_profile: "good"
      downstream:
        latency: 5
        loss_profile: "good"
  dns_net:
    network: dns
    params:
      upstream:
        latency: 20
        loss_profile: "good"
      downstream:
        latency: 20
        loss_profile: "good"
nodes:
  node_type_racetunnel:
    channel_config:
      - direction: bidirectional
        channel: racetunnel
        vars:
          client:
            user_model: ""
          server:
            user_model: ""
    client_per_network:
      client_net_racetunnel: 
        quantity: 1
        profiles:
          irc_8: 1.0
  node_type_sky:
    channel_config:
      - direction: bidirectional
        channel: skyhook
        vars:
          client:
            user_model: skyhook_client_scenario_2.json
          server:
            user_model: skyhook_server_scenario_2.json
    client_per_network:
      client_net_sky: 
        quantity: 1
        profiles:
          irc_12: 1.0
  node_type_obfs:
    channel_config:
      - direction: bidirectional
        channel: obfs
        vars:
          client:
            iat: "0"
          server:
            iat: "0"
    client_per_network:
      client_net_obfs: 
        quantity: 1
        profiles:
          irc_3: 1.0
  node_type_mastodon:
    channel_config:
      - direction: bidirectional
        channel: mastodon
        vars:
          client:
            user_model: mastodon_client_scenario_2.json
          server:
            user_model: mastodon_server_scenario_2.json
    client_per_network:
      client_net_mastodon:
        quantity: 1
        profiles:
          irc_11: 1.0
tgen:
  tgen_type_mastodon:
    tgen_per_network:
      client_net_mastodon:
        quantity: 4
        profiles:
          influencer_1: .25
          normal_1: .25
          lurker_1: .5
      client_net_racetunnel:
        quantity: 4
        profiles:
          normal_2: .5
          lurker_2: .5
      client_net_obfs:
