env: pwnd_cp3_only_skyhook
conversation_duration: 910
max_start_delay: 900
one_way_availability: 30
analysis_window_size: 900
network:
  minio_net:
    network: minio
    params:
      upstream:
        latency: 0
        loss_profile: "none"
      downstream:
        latency: 0
        loss_profile: "none"
  mastodon_net:
    network: mastodon
    params:
      upstream:
        latency: 0
        loss_profile: "none"
      downstream:
        latency: 0
        loss_profile: "none"
  client_net_sky:
    nat: false
    network: client
    params:
      upstream:
        latency: 5
        loss_profile: "excellent"
      downstream:
        latency: 5
        loss_profile: "excellent"
  server_net:
    network: server
    params:
      upstream:
        latency: 10
        loss_profile: "excellent"
      downstream:
        latency: 10
        loss_profile: "excellent"
  dns_net:
    network: dns
    params:
      upstream:
        latency: 20
        loss_profile: "good"
      downstream:
        latency: 20
        loss_profile: "good"
nodes:
  node_type_sky:
    channel_config:
      - direction: bidirectional
        channel: skyhook
        vars:
          client:
            user_model: skyhook_client_scenario_2.json
          server:
            user_model: skyhook_server_scenario_2.json
    client_per_network:
      client_net_sky:
        quantity: 2
        profiles:
          irc_12: 1
