env: validation_only_webtunnel
conversation_duration: 6030
max_start_delay: 30
one_way_availability: 30
analysis_window_size: 30

network:
  minio_net:
    network: minio
    params:
      upstream:
        latency: 0
        loss_profile: "none"
      downstream:
        latency: 0
        loss_profile: "none"
  mastodon_net:
    network: mastodon
    params:
      upstream:
        latency: 0
        loss_profile: "none"
      downstream:
        latency: 0
        loss_profile: "none"
  client_net_racetunnel:
    nat: false
    network: client
    params:
      upstream:
        latency: 30
        loss_profile: "none"
      downstream:
        latency: 30
        loss_profile: "none"
  server_net:
    network: server
    params:
      upstream:
        latency: 5
        loss_profile: "none"
      downstream:
        latency: 5
        loss_profile: "none"
  dns_net:
    network: dns
    params:
      upstream:
        latency: 10
        loss_profile: "none"
      downstream:
        latency: 10
        loss_profile: "none"
nodes:
  node_type_racetunnel:
    channel_config:
      - direction: bidirectional
        channel: racetunnel
        vars:
          client:
            user_model: ""
          server:
            user_model: ""
    client_per_network:
      client_net_racetunnel:
        quantity: 2
        profiles:
          irc_casualchat: 1
tgen:
  tgen_type_ftp:
    tgen_per_network:
      client_net_racetunnel:
        quantity: 6
        profiles:
          fast: .5
          slow: .5
