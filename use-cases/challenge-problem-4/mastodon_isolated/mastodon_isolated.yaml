env: validation_only_mastodon
conversation_duration: 6030
max_start_delay: 30
one_way_availability: 30
analysis_window_size: 30

network:
  minio_net:
    network: minio
    params:
      upstream:
        latency: 0
        loss_profile: "none"
      downstream:
        latency: 0
        loss_profile: "none"
  client_net_mastodon:
    nat: false
    network: client
    params:
      upstream:
        latency: 25
        loss_profile: "none"
      downstream:
        latency: 25
        loss_profile: "none"
  server_net:
    network: server
    params:
      upstream:
        latency: 5
        loss_profile: "none"
      downstream:
        latency: 5
        loss_profile: "none"
  mastodon_net:
    network: mastodon
    params:
      upstream:
        latency: 10
        loss_profile: "none"
      downstream:
        latency: 10
        loss_profile: "none"
  dns_net:
    network: dns
    params:
      upstream:
        latency: 10
        loss_profile: "none"
      downstream:
        latency: 10
        loss_profile: "none"
nodes:
  node_type_mastodon:
    channel_config:
      - direction: bidirectional
        channel: mastodon
        vars:
          client:
            user_model: mastodon_client_scenario_1.json
          server:
            user_model: mastodon_server_scenario_1.json
    client_per_network:
      client_net_mastodon:
        quantity: 2
        profiles:
          irc_casualchat: 1
tgen:
  tgen_type_mastodon:
    tgen_per_network:
      client_net_mastodon:
        quantity: 6
        profiles:
          influencer_1: .33
          normal_1: .33
          lurker_1: .34
