env: pwnd_cp4_ref_arch_config

conversation_duration: 900
max_start_delay: 90
one_way_availability: 30
analysis_window_size: 300
input_seed: 1234

################################################################################
# Network
################################################################################

network:

  client_net_1:
    nat: false
    network: client
    params:
      upstream:
        latency_ms: 30
      downstream:
        latency_ms: 30

  client_net_2:
    nat: false
    network: client
    params:
      upstream:
        latency_ms: 25
      downstream:
        latency_ms: 25

  client_net_3:
    nat: false
    network: client
    params:
      upstream:
        latency_ms: 10
      downstream:
        latency_ms: 10

  client_net_4:
    nat: false
    network: client
    params:
      upstream:
        latency_ms: 15
      downstream:
        latency_ms: 15

  client_net_5:
    nat: false
    network: client
    params:
      upstream:
        latency_ms: 20
      downstream:
        latency_ms: 20

  client_net_6:
    nat: false
    network: client
    params:
      upstream:
        latency_ms: 25
      downstream:
        latency_ms: 25

  server_net_1:
    network: server
    params:
      upstream:
        latency_ms: 5
      downstream:
        latency_ms: 5

  server_net_2:
    network: server
    params:
      upstream:
        latency_ms: 5
      downstream:
        latency_ms: 5

  server_net_3:
    network: server
    params:
      upstream:
        latency_ms: 5
      downstream:
        latency_ms: 5

  server_net_4:
    network: server
    params:
      upstream:
        latency_ms: 5
      downstream:
        latency_ms: 5

  dns_network:
    network: dns
    params:
      upstream:
        latency_ms: 5
      downstream:
        latency_ms: 5

################################################################################
# IRC Server Nodes
################################################################################

irc_servers:

  servers:

    irc_server_1:
      network: server_net_1
      client_channels:
        mastodon:
          user_model: "server_mastodon_bidi.json"
          hashtag_send: "server1_client1"
          hashtag_recv: "client1_server1"
          username: "bob_0"  # not changable, just for reference.

    irc_server_2:
      network: server_net_2
      client_channels:
        iodine:
          max_query_length: 102
          max_response_size: 202

    irc_server_3:
      network: server_net_3
      client_channels:
        obfs:
          iat_mode: 0

    irc_server_4:
      network: server_net_4
      client_channels:
        racetunnel:
          port: 7014  # not changable, just for reference.
          tls_name: "client-tunnel-irc3.pwnd.com"  # not changable, just for reference.

  topology:

    - server_a: irc_server_1
      server_b: irc_server_2
      channel:
        type: obfs
        config:
          iat_mode: 0

    - server_a: irc_server_1
      server_b: irc_server_3
      channel:
        type: skyhook
        config:
          user_model_client: "client_skyhook_gaus.json"
          user_model_server: "server_skyhook_gaus.json"
          fetch_bucket: "apple"
          initial_fetch_uuid: "bird"
          post_bucket: "apple"
          post_uuid: "goat"


    - server_a: irc_server_2
      server_b: irc_server_4
      channel:
        type: skyhook
        config:
          user_model_client: "client_skyhook_gaus.json"
          user_model_server: "server_skyhook_gaus.json"
          fetch_bucket: "cherry"
          initial_fetch_uuid: "duck"
          post_bucket: "cherry"
          post_uuid: "frog"

################################################################################
# IRC Client Nodes
################################################################################

nodes:

  node_type_irc12: # alice 1

    channel_config:

      primary:
        direction: bidirectional
        channel:
          type: mastodon
          config:
            user_model: "client_mastodon_bidi.json"
            username: "alice_1"  # not changable, just for reference.
        server: irc_server_1

      backup:
        direction: bidirectional
        channel:
          type: iodine
          config:
            max_query_length: 102
            max_response_size: 202
        server: irc_server_2

    client_per_network:
      client_net_1:
        quantity: 1
        profiles:
          irc_13: 1

  node_type_irc23: # alice 2

    channel_config:

      primary:
