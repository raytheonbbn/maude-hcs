env: validation_only_skyhook
conversation_duration: 6030
max_start_delay: 30
one_way_availability: 30
analysis_window_size: 30

network:
  minio_net:
    network: minio
    params:
      upstream:
        latency: 5
        loss_profile: "none"
      downstream:
        latency: 5
        loss_profile: "none"
  mastodon_net:
    network: mastodon
    params:
      upstream:
        latency: 10
        loss_profile: "none"
      downstream:
        latency: 10
        loss_profile: "none"
  client_net_sky:
    nat: false
    network: client
    params:
      upstream:
        latency: 20
        loss_profile: "none"
      downstream:
        latency: 20
        loss_profile: "none"
  server_net:
    network: server
    params:
      upstream:
        latency: 5
        loss_profile: "none"
      downstream:
        latency: 5
        loss_profile: "none"
  dns_net:
    network: dns
    params:
      upstream:
        latency: 10
        loss_profile: "none"
      downstream:
        latency: 10
        loss_profile: "none"
nodes:
  node_type_sky:
    channel_config:
      - direction: bidirectional
        channel: skyhook
        vars:
          client:
            user_model: skyhook_client_scenario_1.json
          server:
            user_model: skyhook_server_scenario_1.json
    client_per_network:
      client_net_sky:
        quantity: 2
        profiles:
          irc_casualchat: 1
tgen:
  tgen_type_minio:
    tgen_per_network:
      client_net_skyhook:
        quantity: 6
        profiles:
          fast: .5
          slow: .5
