nodes:
  node_type_mastodon:
    channel_config:
      - direction: bidirectional
        channel: mastodon
        vars:
          client:
            user_model: mastodon_client_scenario_2.json
          server:
            user_model: mastodon_server_scenario_2.json
    client_per_network:
      client_net_mastodon:
        quantity: 2
        profiles:
          irc_casualchat: 1
tgen:
  tgen_type_mastodon:
    tgen_per_network:
      client_net_mastodon:
        quantity: 6
        profiles:
          influencer_1: .25
          normal_1: .25
          lurker_1: .5
      server_net:
        quantity: 6
        profiles:
          normal_2: .5
          lurker_2: .5
  tgen_type_mastodon_monitor:
    tgen_per_network:
      mastodon_net:
        quantity: 1
        profiles:
          default: 1
