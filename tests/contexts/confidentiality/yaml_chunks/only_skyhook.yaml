nodes:
  node_type_sky:
    channel_config:
      - direction: bidirectional
        channel: skyhook
        vars:
          client:
            user_model: skyhook_client_scenario_1.json
          server:
            user_model: skyhook_server_scenario_1.json
    client_per_network:
      client_net_sky:
        quantity: 2
        profiles:
          irc_casualchat: 1
tgen:
  tgen_type_minio:
    tgen_per_network:
      client_net_sky:
        quantity: 6
        profiles:
          fast: .25
          medium: .25
          slow: .5
      server_net:
        quantity: 6
        profiles:
          fast: .25
          medium: .25
          slow: .5
  tgen_type_minio_monitor:
    tgen_per_network:
      minio_net:
        quantity: 1
        profiles:
          default: 1
