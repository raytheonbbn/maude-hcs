env: single_tgen_mastodon
conversation_duration: 600
max_start_delay: 900
one_way_availability: 30
analysis_window_size: 600

network:
  server_net:
    network: server
    params:
      upstream:
        latency: 10
        loss_profile: "excellent"
      downstream:
        latency: 10
        loss_profile: "excellent"
  dns_net:
    network: dns
    params:
      upstream:
        latency: 20
        loss_profile: "good"
      downstream:
        latency: 20
        loss_profile: "good"
  mastodon_net:
    network: mastodon
    params:
      upstream:
        latency: 5
        loss_profile: "good"
      downstream:
        latency: 5
        loss_profile: "good"
  client_net_mastodon:
    nat: false
    network: client
    params:
      upstream:
        latency: 20
        loss_profile: "excellent"
      downstream:
        latency: 20
        loss_profile: "excellent"
        
tgen:
  tgen_type_mastodon:
    tgen_per_network:
      client_net_mastodon:
        quantity: 1
        profiles:
          normal_1: 1.0