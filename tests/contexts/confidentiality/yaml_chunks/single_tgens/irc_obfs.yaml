env: single_tgen_irc_obfs
conversation_duration: 600
max_start_delay: 900
one_way_availability: 30
analysis_window_size: 600

network:
  server_net:
    network: server
    params:
      upstream:
        latency: 10
        loss_profile: "excellent"
      downstream:
        latency: 10
        loss_profile: "excellent"
  dns_net:
    network: dns
    params:
      upstream:
        latency: 20
        loss_profile: "good"
      downstream:
        latency: 20
        loss_profile: "good"
  client_net_obfs:
    nat: false
    network: client
    params:
      upstream:
        latency: 15
        loss_profile: "none"
      downstream:
        latency: 15
        loss_profile: "none"
        
tgen:
  tgen_type_irc:
    tgen_per_network:
      client_net_obfs:
        quantity: 1
        profiles:
          irc_7: 1.0