# Scenario-1 networking; only DNS normal_1 generators, no HCS clients.
env: dns_independence
conversation_duration: 60
max_start_delay: 900
one_way_availability: 30
analysis_window_size: 60
network:
  client_net_mastodon:
    nat: false
    network: client
    params:
      upstream:
        latency: 25
        loss_profile: excellent
      downstream:
        latency: 25
        loss_profile: excellent
  client_net_racetunnel:
    nat: false
    network: client
    params:
      upstream:
        latency: 30
        loss_profile: good
      downstream:
        latency: 30
        loss_profile: good
  client_net_iodine:
    nat: false
    network: client
    params:
      upstream:
        latency: 10
        loss_profile: excellent
      downstream:
        latency: 10
        loss_profile: excellent
  client_net_obfs:
    nat: false
    network: client
    params:
      upstream:
        latency: 15
        loss_profile: good
      downstream:
        latency: 15
        loss_profile: good
  client_net_sky:
    nat: false
    network: client
    params:
      upstream:
        latency: 20
        loss_profile: good
      downstream:
        latency: 20
        loss_profile: good
  server_net:
    network: server
    params:
      upstream:
        latency: 5
        loss_profile: excellent
      downstream:
        latency: 5
        loss_profile: excellent
  minio_net:
    network: minio
    params:
      upstream:
        latency: 5
        loss_profile: good
      downstream:
        latency: 5
        loss_profile: good
  mastodon_net:
    network: mastodon
    params:
      upstream:
        latency: 10
        loss_profile: excellent
      downstream:
        latency: 10
        loss_profile: excellent
  dns_net:
    network: dns
    params:
      upstream:
        latency: 5
        loss_profile: excellent
      downstream:
        latency: 5
        loss_profile: excellent
nodes: {}
tgen:
  tgen_type_dns:
    tgen_per_network:
      client_net_mastodon:
        quantity: 1
        profiles:
          normal_1: 1.0
