env: pwnd_cp3_only_webtunnel
conversation_duration: 910
max_start_delay: 900
one_way_availability: 30
analysis_window_size: 900
network:
  minio_net:
    network: minio
    params:
      upstream:
        latency: 0
        loss_profile: "none"
      downstream:
        latency: 0
        loss_profile: "none"
  client_net_racetunnel:
    nat: false
    network: client
    params:
      upstream:
        latency: 20
        loss_profile: "good"
      downstream:
        latency: 20
        loss_profile: "good"
  server_net:
    network: server
    params:
      upstream:
        latency: 10
        loss_profile: "excellent"
      downstream:
        latency: 10
        loss_profile: "excellent"
  mastodon_net:
    network: mastodon
    params:
      upstream:
        latency: 0
        loss_profile: "none"
      downstream:
        latency: 0
        loss_profile: "none"
  dns_net:
    network: dns
    params:
      upstream:
        latency: 20
        loss_profile: "good"
      downstream:
        latency: 20
        loss_profile: "good"
nodes:
  node_type_racetunnel:
    channel_config:
      - direction: bidirectional
        channel: racetunnel
        vars:
          client:
            user_model: ""
          server:
            user_model: ""
    client_per_network:
      client_net_racetunnel:
        quantity: 2
        profiles:
          irc_8: 1
tgen:
  tgen_type_irc:
    tgen_per_network:
      client_net_racetunnel:
        quantity: 4
        profiles:
          irc_11: .25
          irc_8: .5
          irc_5: .25
  tgen_type_gorilla:
    tgen_per_network:
      client_net_racetunnel:
        quantity: 4
        profiles:
          irc_7: .5
          irc_10: .5
  tgen_type_ftp:
    tgen_per_network:
      client_net_racetunnel:
        quantity: 4
        profiles:
          medium: .5
          slow: .5
